    <text x="36" y="31" fill="#f3f4f1" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.6">LAB · EM CONSTRUÇÃO</text>
    <text x="28" y="62" fill="#101214" font-family="'Inter Tight', Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Assistente pessoal</text>
    <text x="28" y="86" fill="#5c605e" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13">Memória → habilidade → ação</text>
