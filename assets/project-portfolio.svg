<svg xmlns="&#104;ttp://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 720 240" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="portfolio-title portfolio-summary">
  <title id="portfolio-title">Portfólio — Marcus Moura</title>
  <desc id="portfolio-summary">Projetos em Python, web, APIs, automação e experiências mobile. Deployment ao vivo com acesso ao portfólio.</desc>
  <defs>
    <linearGradient id="portfolio-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4FFF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="portfolio-glow" cx="82%" cy="42%" r="62%">
      <stop offset="0" stop-color="#0A4FFF" stop-opacity="0.24"/>
      <stop offset="0.65" stop-color="#0077FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portfolio-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D9FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="portfolio-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.11"/>
      <path d="M 16 0 V 32 M 0 16 H 32" fill="none" stroke="#0A4FFF" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
    <filter id="portfolio-soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="portfolio-clip">
      <rect x="16" y="16" width="688" height="208" rx="9"/>
    </clipPath>
  </defs>

  <style>
    .status, .stack, .cta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
    }
    .status { fill: #8DB7D6; font-size: 23px; letter-spacing: 1.2px; }
    .title {
      fill: #EAF8FF;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 37px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }
    .stack { fill: #00D9FF; font-size: 22.5px; letter-spacing: 0.8px; }
    .cta { fill: #EAF8FF; font-size: 24px; letter-spacing: 1px; }
    .scan-line { animation: portfolio-scan-pass 8s ease-in-out infinite; }
    .live-pulse { animation: portfolio-live-pulse 4.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .data-flow { animation: portfolio-flow 7s linear infinite; }
    @keyframes portfolio-scan-pass {
      0%, 8% { transform: translateY(-48px); opacity: 0.18; }
      18%, 82% { opacity: 0.66; }
      92%, 100% { transform: translateY(252px); opacity: 0.18; }
    }
    @keyframes portfolio-live-pulse {
      0%, 100% { opacity: 0.58; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.14); }
    }
    @keyframes portfolio-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -42; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="240" fill="#020817"/>
  <rect width="720" height="240" fill="url(#portfolio-glow)"/>
  <g clip-path="url(#portfolio-clip)">
    <rect x="16" y="16" width="688" height="208" fill="url(#portfolio-grid)"/>
    <rect class="scan-line" x="16" y="16" width="688" height="46" fill="url(#portfolio-scan)" opacity="0.66"/>
  </g>

  <path d="M 34 16 H 148 M 16 34 V 78 M 572 16 H 686 L 704 34 V 78 M 16 162 V 206 L 34 224 H 148 M 572 224 H 686 L 704 206 V 162"
        fill="none" stroke="url(#portfolio-gradient)" stroke-width="2"/>
  <rect x="24" y="24" width="672" height="192" rx="7" fill="none" stroke="#0077FF" stroke-width="1" stroke-opacity="0.44"/>

  <g aria-hidden="true">
    <circle cx="326" cy="45" r="10" fill="#00D9FF" opacity="0.12" filter="url(#portfolio-soft-glow)"/>
    <circle class="live-pulse" cx="326" cy="45" r="4" fill="#00D9FF"/>
    <path class="data-flow" d="M 516 186 H 558 L 580 164 H 620 L 646 190 H 680"
          fill="none" stroke="#00D9FF" stroke-width="2" stroke-dasharray="7 5" stroke-opacity="0.5"/>
    <g fill="#020817" stroke="#00D9FF" stroke-width="2" opacity="0.72">
      <circle cx="516" cy="186" r="5"/>
      <circle cx="580" cy="164" r="7"/>
      <circle cx="646" cy="190" r="6"/>
      <circle cx="680" cy="190" r="4"/>
    </g>
  </g>

  <text x="40" y="51" class="status">DEPLOYMENT 01 // LIVE</text>
  <text x="40" y="103" class="title">PORTFÓLIO — MARCUS MOURA</text>
  <text x="40" y="151" class="stack">PYTHON · WEB · APIs · AUTOMATION</text>
  <text x="40" y="204" class="cta">ACCESS PORTFOLIO  →</text>
  <rect x="40" y="213" width="278" height="3" fill="url(#portfolio-gradient)"/>
</svg>
