<svg xmlns="&#104;ttp://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 720 120" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="footer-title footer-summary">
  <title id="footer-title">End of transmission</title>
  <desc id="footer-summary">Cyber Blue closing banner for MarcusMouraDev.</desc>
  <defs>
    <linearGradient id="footer-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4FFF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="footer-glow" cx="50%" cy="0" r="82%">
      <stop offset="0" stop-color="#0A4FFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <pattern id="footer-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.1"/>
      <path d="M 16 0 V 32 M 0 16 H 32" fill="none" stroke="#0A4FFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <filter id="footer-soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .closing, .meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
    }
    .closing { fill: #EAF8FF; font-size: 24px; letter-spacing: 1px; }
    .meta { fill: #8DB7D6; font-size: 23px; letter-spacing: 1px; }
    .pulse-node { animation: pulse 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse {
      0%, 100% { opacity: 0.46; transform: scale(0.86); }
      50% { opacity: 1; transform: scale(1.14); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="120" fill="#020817"/>
  <rect width="720" height="120" fill="url(#footer-glow)"/>
  <rect width="720" height="120" fill="url(#footer-grid)"/>
  <path d="M 16 16 H 140 M 580 16 H 704 M 16 104 H 140 M 580 104 H 704"
        fill="none" stroke="url(#footer-gradient)" stroke-width="2"/>
  <path d="M 16 16 V 42 M 704 16 V 42 M 16 78 V 104 M 704 78 V 104"
        fill="none" stroke="#0077FF" stroke-width="1" stroke-opacity="0.72"/>

  <g aria-hidden="true">
    <line x1="250" y1="18" x2="344" y2="18" stroke="#0A4FFF" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="376" y1="18" x2="470" y2="18" stroke="#0A4FFF" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="360" cy="18" r="11" fill="#00D9FF" opacity="0.12" filter="url(#footer-soft-glow)"/>
    <circle class="pulse-node" cx="360" cy="18" r="4" fill="#00D9FF"/>
  </g>

  <text x="360" y="55" text-anchor="middle" class="closing">END OF TRANSMISSION // KEEP BUILDING</text>
  <text x="360" y="90" text-anchor="middle" class="meta">MARCUSMOURADEV · 2026</text>
  <rect x="270" y="101" width="180" height="2" fill="url(#footer-gradient)" opacity="0.82"/>
</svg>
