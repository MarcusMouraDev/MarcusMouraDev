<svg xmlns="&#104;ttp://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 720 240" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="saldo-title saldo-summary">
  <title id="saldo-title">Saldo — RPG Financeiro</title>
  <desc id="saldo-summary">Organização financeira transformada em campanha, missões e progresso. Deployment ao vivo e local-first.</desc>
  <defs>
    <linearGradient id="saldo-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4FFF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="saldo-glow" cx="84%" cy="40%" r="62%">
      <stop offset="0" stop-color="#0077FF" stop-opacity="0.22"/>
      <stop offset="0.68" stop-color="#0A4FFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <pattern id="saldo-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.09"/>
      <path d="M 16 0 V 32 M 0 16 H 32" fill="none" stroke="#0A4FFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <filter id="saldo-soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .status, .stack, .cta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-weight: 700;
    }
    .status { fill: #8DB7D6; font-size: 23px; letter-spacing: 1px; }
    .title {
      fill: #EAF8FF;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 37px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }
    .stack { fill: #00D9FF; font-size: 22.5px; letter-spacing: 0.8px; }
    .cta { fill: #EAF8FF; font-size: 24px; letter-spacing: 1px; }
    .live-pulse { animation: saldo-live-pulse 5.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .progress-signal { animation: saldo-progress 7.5s ease-in-out infinite; }
    .coin-orbit { animation: saldo-orbit 9s linear infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes saldo-live-pulse {
      0%, 100% { opacity: 0.58; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.14); }
    }
    @keyframes saldo-progress {
      0%, 100% { stroke-dashoffset: 48; opacity: 0.55; }
      50% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes saldo-orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="240" fill="#020817"/>
  <rect width="720" height="240" fill="url(#saldo-glow)"/>
  <rect x="16" y="16" width="688" height="208" rx="9" fill="url(#saldo-grid)"/>

  <path d="M 34 16 H 148 M 16 34 V 78 M 572 16 H 686 L 704 34 V 78 M 16 162 V 206 L 34 224 H 148 M 572 224 H 686 L 704 206 V 162"
        fill="none" stroke="url(#saldo-gradient)" stroke-width="2"/>
  <rect x="24" y="24" width="672" height="192" rx="7" fill="none" stroke="#0077FF" stroke-width="1" stroke-opacity="0.44"/>

  <g aria-hidden="true">
    <circle cx="590" cy="45" r="10" fill="#00D9FF" opacity="0.12" filter="url(#saldo-soft-glow)"/>
    <circle class="live-pulse" cx="590" cy="45" r="4" fill="#00D9FF"/>
    <g transform="translate(648 82)">
      <circle cx="0" cy="0" r="38" fill="#0A4FFF" opacity="0.1" filter="url(#saldo-soft-glow)"/>
      <circle class="coin-orbit" cx="0" cy="0" r="32" fill="none" stroke="#0077FF" stroke-width="1" stroke-dasharray="5 7" opacity="0.8"/>
      <path d="M -27 -8 L -19 -20 H 19 L 27 -8 V 20 H -27 Z" fill="#020817" stroke="#00D9FF" stroke-width="2"/>
      <path d="M -27 -8 H 27 M -19 -20 L -12 -8 M 19 -20 L 12 -8" fill="none" stroke="#0077FF" stroke-width="2"/>
      <polygon points="0,-1 8,5 5,15 -5,15 -8,5" fill="#0A4FFF" stroke="#00D9FF" stroke-width="2"/>
    </g>
    <path d="M 500 190 C 526 190 526 168 552 168 S 578 190 604 190 S 630 168 656 168 S 682 190 696 190"
          fill="none" stroke="#0A4FFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.42"/>
    <path class="progress-signal" d="M 500 190 C 526 190 526 168 552 168 S 578 190 604 190 S 630 168 656 168 S 682 190 696 190"
          fill="none" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="48 180"/>
  </g>

  <text x="40" y="51" class="status">DEPLOYMENT 02 // LIVE // LOCAL-FIRST</text>
  <text x="40" y="103" class="title">SALDO — RPG FINANCEIRO</text>
  <text x="40" y="151" class="stack">PRIVACY · GOALS · BUDGET · PROGRESS</text>
  <text x="40" y="204" class="cta">START CAMPAIGN  →</text>
  <rect x="40" y="213" width="252" height="3" fill="url(#saldo-gradient)"/>
</svg>
