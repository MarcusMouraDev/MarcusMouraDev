<svg xmlns="&#104;ttp://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="saldo-title saldo-summary">
  <title id="saldo-title">Saldo — RPG Financeiro</title>
  <desc id="saldo-summary">Card de acesso ao Saldo, com trilha de progresso, missões e um tesouro geométrico.</desc>
  <defs>
    <linearGradient id="saldo-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4FFF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="saldo-glow" cx="82%" cy="44%" r="54%">
      <stop offset="0" stop-color="#0077FF" stop-opacity="0.22"/>
      <stop offset="0.68" stop-color="#0A4FFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <pattern id="saldo-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.09"/>
      <path d="M 20 0 V 40 M 0 20 H 40" fill="none" stroke="#0A4FFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <filter id="saldo-soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .status, .stack, .cta, .mission-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 1.7px;
    }
    .status { fill: #8DB7D6; font-size: 14px; font-weight: 700; }
    .title {
      fill: #EAF8FF;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 31px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .description {
      fill: #8DB7D6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      font-weight: 500;
    }
    .stack { fill: #00D9FF; font-size: 13px; font-weight: 700; }
    .cta { fill: #EAF8FF; font-size: 16px; font-weight: 800; }
    .mission-label { fill: #8DB7D6; font-size: 9px; }
    .live-pulse { animation: saldo-live-pulse 5.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .progress-signal { animation: saldo-progress 7.5s ease-in-out infinite; }
    .coin-orbit { animation: saldo-orbit 9s linear infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes saldo-live-pulse {
      0%, 100% { opacity: 0.58; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.14); }
    }
    @keyframes saldo-progress {
      0%, 100% { stroke-dashoffset: 58; opacity: 0.55; }
      50% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes saldo-orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="300" fill="#020817"/>
  <rect width="1200" height="300" fill="url(#saldo-glow)"/>
  <rect x="24" y="24" width="1152" height="252" rx="10" fill="url(#saldo-grid)"/>

  <path d="M 48 24 H 218 M 24 48 V 102 M 982 24 H 1152 L 1176 48 V 102 M 24 198 V 252 L 48 276 H 218 M 982 276 H 1152 L 1176 252 V 198"
        fill="none" stroke="url(#saldo-gradient)" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="228" rx="7" fill="none" stroke="#0077FF" stroke-width="1" stroke-opacity="0.44"/>
  <path d="M 36 105 H 53 M 36 195 H 53 M 1147 105 H 1164 M 1147 195 H 1164" stroke="#00D9FF" stroke-width="2"/>

  <g aria-hidden="true">
    <circle cx="278" cy="67" r="10" fill="#00D9FF" opacity="0.12" filter="url(#saldo-soft-glow)"/>
    <circle class="live-pulse" cx="278" cy="67" r="4" fill="#00D9FF"/>

    <path d="M 828 216 C 864 216 864 180 900 180 S 936 216 972 216 S 1008 180 1044 180 S 1080 216 1116 216"
          fill="none" stroke="#0A4FFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45"/>
    <path class="progress-signal" d="M 828 216 C 864 216 864 180 900 180 S 936 216 972 216 S 1008 180 1044 180 S 1080 216 1116 216"
          fill="none" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="58 230"/>
    <g fill="#020817" stroke="#00D9FF" stroke-width="2">
      <circle cx="864" cy="199" r="7"/>
      <circle cx="972" cy="216" r="7"/>
      <circle cx="1080" cy="199" r="7"/>
    </g>
    <g fill="#00D9FF">
      <circle cx="864" cy="199" r="2"/>
      <circle cx="972" cy="216" r="2"/>
      <circle cx="1080" cy="199" r="2"/>
    </g>
    <text x="846" y="228" class="mission-label">M01</text>
    <text x="954" y="244" class="mission-label">M02</text>
    <text x="1062" y="228" class="mission-label">M03</text>

    <g transform="translate(980 105)">
      <circle cx="0" cy="0" r="58" fill="#0A4FFF" opacity="0.10" filter="url(#saldo-soft-glow)"/>
      <circle class="coin-orbit" cx="0" cy="0" r="49" fill="none" stroke="#0077FF" stroke-width="1" stroke-dasharray="5 8" opacity="0.8"/>
      <path d="M -42 -12 L -30 -31 H 30 L 42 -12 V 30 H -42 Z" fill="#020817" stroke="#00D9FF" stroke-width="2"/>
      <path d="M -42 -12 H 42 M -30 -31 L -19 -12 M 30 -31 L 19 -12" fill="none" stroke="#0077FF" stroke-width="2"/>
      <polygon points="0,-1 12,8 7,23 -7,23 -12,8" fill="#0A4FFF" stroke="#00D9FF" stroke-width="2"/>
      <circle cx="0" cy="10" r="3" fill="#EAF8FF"/>
    </g>
  </g>

  <text x="72" y="72" class="status">DEPLOYMENT 02 // LIVE // LOCAL-FIRST</text>
  <text x="72" y="127" class="title">SALDO — RPG FINANCEIRO</text>
  <text x="72" y="165" class="description">Organização financeira transformada em campanha, missões e progresso.</text>
  <text x="72" y="205" class="stack">PRIVACY  ·  GOALS  ·  BUDGET  ·  PROGRESS</text>
  <text x="72" y="251" class="cta">START CAMPAIGN  →</text>
  <rect x="72" y="262" width="200" height="2" fill="url(#saldo-gradient)"/>
</svg>
